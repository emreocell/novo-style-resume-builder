site_name: Novo-Style Resume Builder
site_description: Docs for a free, private, open-source resume builder that runs in your browser. Live preview, PDF and ATS export, no signup.
site_url: https://parvez3019.github.io/novo-style-resume-builder/docs/
site_author: parvez3019
repo_url: https://github.com/parvez3019/novo-style-resume-builder
repo_name: parvez3019/novo-style-resume-builder
edit_uri: edit/main/docs/
copyright: MIT licensed · Independent educational project, not affiliated with Novo Resume.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/parvez3019/novo-style-resume-builder
  # Optional privacy-friendly analytics (e.g. GoatCounter / Plausible) can be added here later.

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Editing your resume: guide/editing.md
      - Themes & layout: guide/themes.md
      - Importing a resume: guide/import.md
      - Exporting to PDF: guide/export-pdf.md
      - Exporting ATS text: guide/export-ats.md
  - ATS resume tips: ats-tips.md
  - Privacy: privacy.md
  - Self-hosting: self-hosting.md
  - Developers:
      - Architecture: architecture.md
      - Contributing: contributing.md
  - FAQ: faq.md
  - Changelog: changelog.md
